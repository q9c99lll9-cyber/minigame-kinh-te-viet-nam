<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <title>QUAN HỆ LỢI ÍCH KINH TẾ Ở VIỆT NAM</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172d36;
      --muted: #62747a;
      --paper: #fffefa;
      --canvas: #f4f2ec;
      --line: #e6e5dc;
      --teal: #0d756d;
      --teal-dark: #095a55;
      --teal-soft: #e8f4f1;
      --gold: #e4b64c;
      --green: #18744e;
      --green-soft: #e8f5ed;
      --red: #a64439;
      --red-soft: #fbefec;
      --shadow: 0 22px 60px rgba(26, 49, 54, .09), 0 2px 8px rgba(26, 49, 54, .04);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 86% 5%, rgba(228, 182, 76, .15), transparent 26rem),
        radial-gradient(ellipse at 4% 80%, rgba(13, 117, 109, .08), transparent 27rem),
        var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    button { font: inherit; }
    .page { width: min(100% - 36px, 1050px); margin: 0 auto; padding: 34px 0 28px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 25px; }
    .brand { display: inline-flex; gap: 11px; align-items: center; font-size: 13px; font-weight: 750; letter-spacing: .055em; text-transform: uppercase; color: #426067; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; color: white; background: var(--teal); box-shadow: 0 5px 14px rgba(13, 117, 109, .2); }
    .brand-mark svg { width: 19px; height: 19px; }
    .topic-chip { border: 1px solid #e1ded2; border-radius: 999px; padding: 7px 12px; color: #6d7772; background: rgba(255,255,255,.55); font-size: 12px; font-weight: 650; }
    .intro { margin: 0 auto 24px; max-width: 760px; text-align: center; }
    .eyebrow { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 9px; color: var(--teal); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .eyebrow::before, .eyebrow::after { content: ""; width: 17px; height: 1px; background: #96c2b9; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(29px, 5vw, 44px); letter-spacing: -.035em; line-height: 1.13; font-weight: 700; }
    .intro p { max-width: 615px; margin: 12px auto 0; color: var(--muted); font-size: 15px; }
    .game-shell { display: grid; grid-template-columns: minmax(0, 1fr); border: 1px solid rgba(221, 221, 210, .85); border-radius: 22px; overflow: hidden; background: var(--paper); box-shadow: var(--shadow); }
    .main-panel { padding: 30px clamp(22px, 4vw, 42px) 32px; min-width: 0; }
    .status-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 11px; }
    .question-count { color: var(--muted); font-size: 13px; font-weight: 700; }
    .question-count strong { color: var(--ink); font-size: 14px; }
    .live-score { display: flex; align-items: center; gap: 7px; color: #7e692f; font-size: 13px; font-weight: 750; }
    .live-score svg { width: 17px; height: 17px; }
    .progress-track { width: 100%; height: 7px; overflow: hidden; border-radius: 99px; background: #ecece4; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--teal), #4ca78c); transition: width .35s ease; }
    .question-area { min-height: 454px; padding-top: 27px; }
    .question-label { display: inline-flex; align-items: center; gap: 7px; color: #a27b21; font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .question-label .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px #f9f1d9; }
    h2 { margin: 13px 0 21px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(21px, 3vw, 27px); line-height: 1.35; letter-spacing: -.018em; }
    .question-area h2 { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; line-height: 1.45; letter-spacing: -.025em; }
    .answers { display: grid; gap: 10px; }
    .answer {
      display: flex; gap: 13px; align-items: flex-start; width: 100%; padding: 13px 15px;
      color: var(--ink); text-align: left; border: 1px solid #e6e8e1; border-radius: 12px; background: white;
      cursor: pointer; transition: border-color .18s ease, background .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .answer:hover:not(:disabled) { border-color: #8fbeb5; transform: translateY(-1px); }
    .answer:focus-visible, .primary:focus-visible, .secondary:focus-visible { outline: 3px solid rgba(13, 117, 109, .25); outline-offset: 2px; }
    .answer[aria-pressed="true"] { border-color: var(--teal); background: #f2faf8; box-shadow: inset 0 0 0 1px var(--teal); }
    .answer:disabled { cursor: default; }
    .answer-key { display: grid; flex: 0 0 28px; place-items: center; width: 28px; height: 28px; margin-top: -1px; border: 1px solid #dfe4df; border-radius: 8px; color: #5b6e6e; background: #fafbf8; font-size: 12px; font-weight: 800; }
    .answer[aria-pressed="true"] .answer-key { border-color: var(--teal); color: white; background: var(--teal); }
    .answer-copy { padding-top: 2px; font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; line-height: 1.5; }
    .answer.is-correct { border-color: #8cc7a5; background: var(--green-soft); }
    .answer.is-correct .answer-key { border-color: var(--green); color: #fff; background: var(--green); }
    .answer.is-wrong { border-color: #e0a9a0; background: var(--red-soft); }
    .answer.is-wrong .answer-key { border-color: var(--red); color: #fff; background: var(--red); }
    .feedback { display: none; margin-top: 17px; padding: 15px 16px; border-radius: 12px; animation: appear .25s ease both; }
    .feedback.visible { display: block; }
    .feedback.correct { border: 1px solid #c8e5d3; background: #f1faf4; }
    .feedback.incorrect { border: 1px solid #f0d3cc; background: #fff7f4; }
    .feedback-title { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 14px; font-weight: 800; }
    .feedback.correct .feedback-title { color: var(--green); }
    .feedback.incorrect .feedback-title { color: var(--red); }
    .feedback p { margin: 0; color: #4f6262; font-size: 13px; line-height: 1.55; }
    .controls { display: flex; justify-content: flex-end; gap: 10px; padding-top: 20px; }
    .primary, .secondary { min-height: 44px; padding: 0 19px; border: 0; border-radius: 11px; font-size: 14px; font-weight: 750; cursor: pointer; transition: transform .18s ease, background .18s ease, opacity .18s ease; }
    .primary { display: inline-flex; align-items: center; gap: 9px; color: white; background: var(--teal); box-shadow: 0 6px 14px rgba(13, 117, 109, .17); }
    .primary:hover:not(:disabled) { background: var(--teal-dark); transform: translateY(-1px); }
    .primary:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; }
    .primary svg { width: 16px; height: 16px; }
    .secondary { border: 1px solid #dfe3dc; color: #496064; background: transparent; }
    .secondary:hover { background: #eff2ed; }
    .source-note { margin: 19px 2px 0; color: #8a928b; text-align: center; font-size: 11px; }
    .result { display: none; min-height: 454px; padding: 34px 0 10px; text-align: center; animation: appear .3s ease both; }
    .result.visible { display: block; }
    .result-seal { display: grid; place-items: center; width: 68px; height: 68px; margin: 0 auto 15px; border: 1px solid #f0e1b5; border-radius: 22px; color: #98731c; background: #fbf4df; }
    .result-seal svg { width: 31px; height: 31px; }
    .result h2 { margin: 0 0 8px; font-size: 32px; }
    .result-lead { max-width: 475px; margin: 0 auto; color: var(--muted); }
    .result-score { display: flex; align-items: baseline; justify-content: center; gap: 7px; margin: 22px 0 17px; }
    .result-score strong { color: var(--teal-dark); font-family: Georgia, "Times New Roman", serif; font-size: 54px; line-height: 1; }
    .result-score span { color: #788581; font-size: 14px; font-weight: 700; }
    .result-meter { max-width: 350px; height: 10px; margin: 0 auto 24px; overflow: hidden; border-radius: 99px; background: #ebede6; }
    .result-meter div { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #dca83a, #0d8a75); transition: width .5s ease; }
    .result-controls { justify-content: center; padding-top: 0; }
    .result-details { display: flex; justify-content: center; gap: 24px; margin-bottom: 24px; color: #71807c; font-size: 12px; }
    .result-details strong { color: var(--ink); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 760px) {
      .page { width: min(100% - 24px, 620px); padding-top: 20px; }
      .game-shell { grid-template-columns: 1fr; border-radius: 18px; }
      .main-panel { padding: 24px 21px; }
      .question-area, .result { min-height: auto; }
      .question-area { padding-top: 23px; }
      .result { padding: 27px 0 4px; }
      .source-note { margin-top: 14px; }
    }
    @media (max-width: 460px) {
      .masthead { align-items: flex-start; }
      .brand { font-size: 11px; }
      .topic-chip { max-width: 140px; text-align: center; font-size: 10px; }
      .intro p { font-size: 14px; }
      .status-row { margin-bottom: 9px; }
      .answer { padding: 12px; gap: 10px; }
      .answer-copy { font-size: 13px; }
      .controls { justify-content: stretch; }
      .controls .primary { justify-content: center; width: 100%; }
      .result-details { gap: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 18.5V5.8c0-.7.6-1.3 1.3-1.3H19v13.7H5.3c-.7 0-1.3.6-1.3 1.3Zm0 0c0 .7.6 1.3 1.3 1.3H19M8 8h7M8 11h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Minigame kiến thức
      </div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">QUAN HỆ LỢI ÍCH KINH TẾ Ở VIỆT NAM</h1>
    </section>

    <section class="game-shell" aria-label="Trò chơi trắc nghiệm">
      <div class="main-panel">
        <div class="status-row" id="status-row">
          <div class="question-count" id="question-count"><strong>Câu 1</strong> / 15</div>
          <div class="live-score" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span id="live-score">0 điểm</span></div>
        </div>
        <div class="progress-track" id="progress-track" role="progressbar" aria-label="Tiến độ trò chơi" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div>

        <div class="question-area" id="question-area">

        </div>

        <section class="result" id="result" aria-labelledby="result-title" aria-live="polite">
          <div class="result-seal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m9.3 12.1 1.8 1.8 3.8-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

          <div class="controls result-controls"><button class="primary" id="restart-button" type="button">Chơi lại từ đầu <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16.2 8A6.3 6.3 0 1 0 16 12m.2-4V4.6M16.2 8h-3.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
        </section>
      </div>

    </section>
    <p class="source-note">15 câu hỏi trắc nghiệm · Chọn đáp án, xem giải thích và theo dõi điểm số.</p>
  </main>

  <script>
    const questions = [
      {
        category: "Khái niệm lợi ích kinh tế",
        text: "Lợi ích kinh tế được hiểu như thế nào?",
        options: [

        correct: 0,
        explanation: "Lợi ích kinh tế là lợi ích vật chất mà con người thu được khi tham gia hoạt động kinh tế; nó gắn với việc thỏa mãn nhu cầu vật chất."

      {

        options: [
          "Mức độ phát triển văn hóa của một cộng đồng, không phụ thuộc quan hệ kinh tế.",

      {
        category: "Biểu hiện lợi ích kinh tế",

        correct: 2,

      {

        options: [

        ],

        explanation: "Khi có nhiều người tìm việc, cạnh tranh có thể gây sức ép giảm tiền lương và làm một số người mất việc. Sự đoàn kết, hỗ trợ và tổ chức đại diện hợp pháp giúp người lao động bảo vệ lợi ích của mình."
      },
      {
        category: "Lợi ích cá nhân, nhóm và xã hội",
        text: "Quan điểm nào phù hợp về lợi ích cá nhân, lợi ích nhóm và lợi ích xã hội?",
        options: [
          "Mọi lợi ích nhóm đều có hại và cần bị loại bỏ.",
          "Lợi ích cá nhân không liên quan đến sự phát triển của xã hội.",
          "Lợi ích cá nhân chính đáng là nền tảng của các lợi ích khác; lợi ích xã hội định hướng lợi ích cá nhân, còn lợi ích nhóm chỉ nên được tôn trọng khi không gây hại cho lợi ích chung.",
          "Lợi ích của một nhóm luôn được ưu tiên hơn lợi ích quốc gia."
        ],
        correct: 2,
        explanation: "Lợi ích cá nhân chính đáng là cơ sở để thực hiện các lợi ích tập thể và xã hội; lợi ích xã hội định hướng cho hoạt động cá nhân. Lợi ích nhóm cần được xem xét theo tác động của nó đối với lợi ích quốc gia và các lợi ích hợp pháp khác."
      },
      {
        category: "Phương thức thực hiện lợi ích",
        text: "Hai phương thức cơ bản để thực hiện lợi ích kinh tế trong nền kinh tế thị trường là gì?",
        options: [
          "Thỏa thuận tự phát và phân chia bình quân mọi kết quả.",
          "Chỉ thực hiện theo mệnh lệnh hành chính của Nhà nước.",

        ],
        correct: 3,
        explanation: "Lợi ích kinh tế được thực hiện theo nguyên tắc thị trường và theo chính sách của Nhà nước, cùng vai trò của các tổ chức xã hội. Phương thức thứ hai giúp khắc phục những hạn chế xã hội nếu chỉ dựa vào thị trường."
      },
      {
        category: "Vai trò của Nhà nước",
        text: "Nhà nước tạo môi trường thuận lợi cho các chủ thể tìm kiếm lợi ích kinh tế bằng cách nào?",
        options: [
          "Bảo đảm ổn định chính trị, xây dựng pháp luật thông thoáng và bảo vệ lợi ích hợp pháp, đầu tư kết cấu hạ tầng, ban hành chính sách phù hợp và xây dựng môi trường văn hóa tôn trọng kỷ cương, chữ tín.",
          "Thay thế mọi doanh nghiệp trong hoạt động sản xuất và kinh doanh.",
          "Chỉ tập trung mở rộng hạ tầng, không cần quan tâm đến pháp luật và ổn định chính trị.",
          "Hạn chế quyền kinh doanh hợp pháp để giảm cạnh tranh giữa các chủ thể."
        ],
        correct: 0,
        explanation: "Môi trường thuận lợi bao gồm ổn định chính trị, pháp luật bảo vệ lợi ích hợp pháp, kết cấu hạ tầng, chính sách phù hợp với từng giai đoạn và môi trường văn hóa tôn trọng pháp luật, kỷ cương, chữ tín."
      },
      {
        category: "Điều hòa và kiểm soát lợi ích",
        text: "Để hài hòa lợi ích cá nhân, doanh nghiệp và xã hội, Nhà nước cần kết hợp giải pháp nào?",
        options: [
          "Bảo đảm mọi chủ thể có thu nhập bằng nhau, bất kể đóng góp.",
          "Điều tiết phân phối để hạn chế chênh lệch quá đáng, tạo cơ hội và mức sống tối thiểu; đồng thời ngăn chặn thu nhập bất hợp pháp bằng pháp luật, giám sát và bộ máy công quyền liêm chính.",
          "Ưu tiên lợi nhuận doanh nghiệp và bỏ qua hệ quả đối với người lao động, người tiêu dùng.",
          "Chỉ tuyên truyền đạo đức, không cần chính sách phân phối hay xử lý vi phạm."
        ],
        correct: 1,
        explanation: "Nhà nước cần kết hợp chính sách phân phối để hạn chế bất bình đẳng thái quá và bảo đảm cơ hội với việc kiểm soát các lợi ích tiêu cực như buôn lậu, hàng giả, lừa đảo, tham nhũng và trốn thuế."
      }
    ];

    const letters = ["A", "B", "C", "D"];
    let current = 0;
    let selected = null;
    let locked = false;
    let score = 0;

    const countEl = document.getElementById("question-count");
    const progressFill = document.getElementById("progress-fill");
    const progressTrack = document.getElementById("progress-track");
    const categoryEl = document.getElementById("question-category");
    const questionText = document.getElementById("question-text");
    const answersEl = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const feedbackTitle = document.getElementById("feedback-title");
    const feedbackCopy = document.getElementById("feedback-copy");
    const confirmButton = document.getElementById("confirm-button");
    const questionArea = document.getElementById("question-area");
    const result = document.getElementById("result");

    function updateProgress(completed) {
      const percent = Math.round(completed / questions.length * 100);
      progressFill.style.width = `${percent}%`;
      progressTrack.setAttribute("aria-valuenow", String(completed));
    }

    function renderQuestion() {
      const q = questions[current];
      selected = null;
      locked = false;
      countEl.innerHTML = `<strong>Câu ${current + 1}</strong> / ${questions.length}`;
      categoryEl.textContent = q.category;
      questionText.textContent = q.text;
      answersEl.replaceChildren();
      feedback.className = "feedback";
      feedbackTitle.textContent = "";
      feedbackCopy.textContent = "";
      confirmButton.disabled = true;
      confirmButton.innerHTML = 'Xác nhận đáp án <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.setAttribute("aria-pressed", "false");
        button.innerHTML = `<span class="answer-key">${letters[index]}</span><span class="answer-copy"></span>`;
        button.querySelector(".answer-copy").textContent = option;
        button.addEventListener("click", () => selectAnswer(index));
        answersEl.append(button);
      });
      updateProgress(current);
      document.getElementById("live-score").textContent = `${score} điểm`;
      questionText.focus({preventScroll: true});
    }

    function selectAnswer(index) {
      if (locked) return;
      selected = index;
      [...answersEl.children].forEach((button, i) => button.setAttribute("aria-pressed", String(i === index)));
      confirmButton.disabled = false;
    }

    function confirmAnswer() {
      if (selected === null || locked) return;
      locked = true;
      const q = questions[current];
      const correct = selected === q.correct;
      if (correct) score += 1;
      [...answersEl.children].forEach((button, i) => {
        button.disabled = true;
        if (i === q.correct) button.classList.add("is-correct");
        if (i === selected && !correct) button.classList.add("is-wrong");
      });
      feedback.className = `feedback visible ${correct ? "correct" : "incorrect"}`;
      feedbackTitle.textContent = correct ? "✓  Chính xác!" : `Đáp án đúng: ${letters[q.correct]}`;
      feedbackCopy.textContent = q.explanation;
      document.getElementById("live-score").textContent = `${score} điểm`;
      updateProgress(current + 1);
      confirmButton.innerHTML = current === questions.length - 1
        ? 'Xem kết quả <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : 'Câu tiếp theo <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }

    function showResult() {
      questionArea.hidden = true;
      result.classList.add("visible");
      countEl.innerHTML = `<strong>Hoàn thành</strong> · ${questions.length} / ${questions.length}`;
      document.getElementById("live-score").textContent = `${score} điểm`;
      document.getElementById("final-score").textContent = String(score);
      document.getElementById("right-count").textContent = String(score);
      document.getElementById("wrong-count").textContent = String(questions.length - score);
      document.getElementById("result-meter-fill").style.width = `${score / questions.length * 100}%`;
      const lead = score === questions.length
        ? "Xuất sắc! Bạn đã nắm rất chắc những nội dung trọng tâm."
        : score >= 12
          ? "Bạn đã hiểu tốt phần lớn nội dung. Hãy xem lại những câu cần ôn thêm để củng cố kiến thức."
          : score >= 7
            ? "Bạn đã có nền tảng ban đầu. Đọc lại phần giải thích rồi thử sức thêm một lượt nhé."
            : "Hãy xem lại từng phần giải thích để hệ thống hóa các ý chính, rồi chơi lại khi sẵn sàng. ";
      document.getElementById("result-lead").textContent = lead;
      document.getElementById("restart-button").focus({preventScroll: true});
    }

    confirmButton.addEventListener("click", () => {
      if (!locked) {
        confirmAnswer();
        return;
      }
      if (current === questions.length - 1) {
        showResult();
        return;
      }
      current += 1;
      renderQuestion();
    });

    document.getElementById("restart-button").addEventListener("click", () => {
      current = 0;
      score = 0;
      result.classList.remove("visible");
      questionArea.hidden = false;
      renderQuestion();
    });

    renderQuestion();
  </script>
